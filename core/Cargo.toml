[package]
name = "rustgit-core"
version = "0.1.0"
edition = "2021"
description = "Core library for the RustGit client (Rust backend, Flutter UI)"

[lib]
name = "rustgit_core"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
