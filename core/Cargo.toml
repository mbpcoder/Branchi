[package]
name = "branchi-core"
version = "0.1.0"
edition = "2021"
description = "Core library for the Branchi client (Rust backend, Flutter UI)"

[lib]
name = "branchi_core"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
