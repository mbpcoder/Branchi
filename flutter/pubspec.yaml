name: branchi
description: Branchi - a Rust + Flutter git client (Rust backend, Flutter UI).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  window_manager: ^0.5.2
  shared_preferences: ^2.2.2
  xterm: ^4.0.0
  flutter_pty: ^0.4.1
  file_picker: ^8.1.3
  path: ^1.9.0
  ffi: ^2.1.3
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/branchi_logo.png

flutter_launcher_icons:
  image_path: "assets/icon/branchi_logo.png"
  windows:
    generate: true
    icon_size: 256
