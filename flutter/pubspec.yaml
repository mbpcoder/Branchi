name: rustgit
description: RustGit - a Rust + Flutter git client (Rust backend, Flutter UI).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  window_manager: ^0.5.2
  shared_preferences: ^2.2.2
  xterm: ^4.0.0
  flutter_pty: ^0.4.1
  file_picker: ^8.1.3
  path: ^1.9.0
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
