name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native library (branchi_core.dll)
        run: cargo build --release -p branchi-core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Windows platform scaffolding exists
        working-directory: flutter
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Flutter Windows app
        working-directory: flutter
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v',''
          flutter build windows --release --build-name=$version --dart-define=BRANCHI_VERSION=$version

      - name: Bundle native library with the app
        run: Copy-Item target\release\branchi_core.dll flutter\build\windows\x64\runner\Release\branchi_core.dll

      - name: Package release archive
        run: Compress-Archive -Path flutter\build\windows\x64\runner\Release\* -DestinationPath branchi-windows.zip

      - name: Build installer (Inno Setup)
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v',''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\flutter\build\windows\x64\runner\Release" installer\windows\branchi.iss

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $hash = (Get-FileHash dist\branchi-setup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\branchi-setup.exe.sha256 -Value "$hash  branchi-setup.exe" -NoNewline
          $files = @("branchi-windows.zip", "dist\branchi-setup.exe", "dist\branchi-setup.exe.sha256")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Branchi $tag" --generate-notes
          }
          exit $LASTEXITCODE

  update-scoop:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Scoop manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern branchi-windows.zip --dir /tmp/rel
          hash=$(sha256sum /tmp/rel/branchi-windows.zip | cut -d' ' -f1)
          version="${TAG#v}"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/branchi-windows.zip"
          jq --arg v "$version" --arg u "$url" --arg h "$hash" \
            '.version=$v | .architecture."64bit".url=$u | .architecture."64bit".hash=$h' \
            bucket/branchi.json > /tmp/branchi.json
          mv /tmp/branchi.json bucket/branchi.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/branchi.json
          git commit -m "Update Scoop manifest to $version" || exit 0
          git push origin HEAD:main

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal native library (libbranchi_core.dylib)
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          cargo build --release -p branchi-core --target aarch64-apple-darwin
          cargo build --release -p branchi-core --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/libbranchi_core.dylib \
            target/aarch64-apple-darwin/release/libbranchi_core.dylib \
            target/x86_64-apple-darwin/release/libbranchi_core.dylib

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The app needs to open any folder, run a terminal and reach git
      # servers, so the App Sandbox (on by default) is turned off.
      - name: Ensure macOS platform scaffolding exists
        working-directory: flutter
        run: |
          if [ ! -d macos ]; then flutter create --platforms=macos --org com.mbpcoder .; fi
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = Branchi/' macos/Runner/Configs/AppInfo.xcconfig
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$f"
          done

      - name: Generate macOS app icon
        working-directory: flutter
        continue-on-error: true
        run: |
          flutter pub get
          cat > /tmp/icons-macos.yaml <<'YAML'
          flutter_launcher_icons:
            image_path: "assets/icon/branchi_logo.png"
            macos:
              generate: true
              image_path: "assets/icon/branchi_logo.png"
          YAML
          dart run flutter_launcher_icons -f /tmp/icons-macos.yaml

      - name: Build Flutter macOS app
        working-directory: flutter
        run: |
          flutter pub get
          flutter build macos --release

      # Not signed with a Developer ID yet: re-sign ad hoc after adding the
      # library, since Apple Silicon refuses to run unsigned code.
      - name: Bundle native library and build DMG
        run: |
          app=flutter/build/macos/Build/Products/Release/Branchi.app
          mkdir -p "$app/Contents/Frameworks"
          cp target/universal/libbranchi_core.dylib "$app/Contents/Frameworks/"
          codesign --force --deep --sign - "$app"
          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Branchi -srcfolder dmg -ov -format UDZO branchi-macos.dmg

      - name: Upload DMG to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" branchi-macos.dmg --clobber

  # Runs after update-scoop so the two jobs don't race pushing to main.
  update-cask:
    needs: [build-macos, update-scoop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Homebrew cask
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern branchi-macos.dmg --dir /tmp/rel
          hash=$(sha256sum /tmp/rel/branchi-macos.dmg | cut -d' ' -f1)
          version="${TAG#v}"
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 .*/  sha256 \"$hash\"/" Casks/branchi.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/branchi.rb
          git commit -m "Update Homebrew cask to $version" || exit 0
          git push origin HEAD:main

  build-linux-snap:
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libssl-dev

      - name: Build native library (libbranchi_core.so)
        run: cargo build --release -p branchi-core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Linux platform scaffolding exists
        working-directory: flutter
        run: |
          if [ ! -d linux ]; then flutter create --platforms=linux .; fi

      - name: Build Flutter Linux app
        working-directory: flutter
        run: |
          flutter pub get
          flutter build linux --release

      - name: Bundle native library with the app
        run: cp target/release/libbranchi_core.so flutter/build/linux/x64/release/bundle/lib/

      - name: Set snap version from tag
        run: |
          sed -i "s/^version: .*/version: '${GITHUB_REF_NAME#v}'/" snap/snapcraft.yaml

      - uses: snapcore/action-build@v1
        id: snap

      - name: Upload snap to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.snap.outputs.snap }}" --clobber

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable
